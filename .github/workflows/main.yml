name: T1 Ranjha Auto Chat Farmer

on:
  schedule:
    # Afternoon checks: 2:00 PM & 3:00 PM IST (08:30 & 09:30 UTC)
    - cron: '30 8,9 * * *'
    # Afternoon follow-up checks: 2:15 PM & 3:15 PM IST (08:45 & 09:45 UTC)
    - cron: '45 8,9 * * *'
    # Night check 1: 10:00 PM IST (16:30 UTC)
    - cron: '30 16 * * *'
    # Night check 2: 10:10 PM IST (16:40 UTC)
    - cron: '40 16 * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Optional: Stream link (Leave blank to auto-detect @T1RANJHA)'
        required: false
        default: ''

# Prevents a second bot from starting if the first check is already farming the stream
concurrency:
  group: t1ranjha-live-farmer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  farm-points:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep repository active for 2+ years (Prevent 60-day GitHub sleep)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"Last checked: %Y-%m-%d %H:%M:%S UTC" > .last_check
          git add .last_check
          git diff --staged --quiet || git commit -m "Auto keep-alive check"
          git push || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Run Chat Farmer
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
        run: python bot.py
        
