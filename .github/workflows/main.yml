name: T1 Ranjha Auto Chat Farmer

on:
  schedule:
    # Afternoon Window: 2:00 PM, 2:20 PM, 3:00 PM, 3:30 PM, 4:30 PM IST
    - cron: '30 8 * * *'
    - cron: '50 8 * * *'
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    # Night Window: 9:55 PM, 10:15 PM, 10:45 PM, 11:30 PM, 12:30 AM, 1:30 AM IST
    - cron: '25 16 * * *'
    - cron: '45 16 * * *'
    - cron: '15 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Optional: Stream link (Leave blank to auto-detect @T1RANJHA)'
        required: false
        default: ''

# Prevents a second bot from starting if the first check is already farming the stream
concurrency:
  group: t1ranjha-live-farmer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  farm-points:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep repository active for 2+ years (Prevent 60-day GitHub sleep)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"Last checked: %Y-%m-%d %H:%M:%S UTC" > .last_check
          git add .last_check
          git diff --staged --quiet || git commit -m "Auto keep-alive check"
          git push || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run Chat Farmer
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
        run: python bot.py
        
